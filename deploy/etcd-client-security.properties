# Load with --spring.config.additional-location=file:/etc/cache/etcd-client-security.properties
# Supply real service-owned PKCS12 stores and password files through a secret manager.
cache.mode=consensus
cache.namespace=production-v3
cache.etcd=https://etcd-0:2379,https://etcd-1:2379,https://etcd-2:2379
cache.metadata-max-entries=100000
cache.etcd-security.enabled=true
cache.etcd-security.username=cache
cache.etcd-security.password-file=/run/secrets/etcd-password
cache.etcd-security.key-store=/run/secrets/etcd-client.p12
cache.etcd-security.key-password-file=/run/secrets/etcd-key-password
cache.etcd-security.trust-store=/run/secrets/etcd-trust.p12
cache.etcd-security.trust-password-file=/run/secrets/etcd-trust-password
