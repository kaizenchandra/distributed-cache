# Shared definitions included by both legacy and consensus Compose stacks.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: [start-dev, --import-realm]
    ports: ['127.0.0.1:8180:8080']
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HTTP_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?run scripts/init-auth.py}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/init-auth.py}
      KEYCLOAK_USER_PASSWORD: ${KEYCLOAK_USER_PASSWORD:?run scripts/init-auth.py}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init-auth.py}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/keycloak/cache-realm.json:/opt/keycloak/data/import/cache-realm.json:ro
    mem_limit: 768m
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      keycloak:
        condition: service_started
