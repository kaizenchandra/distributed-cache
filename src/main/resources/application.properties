spring.application.name=distributed-cache
server.tomcat.threads.max=32
server.tomcat.threads.min-spare=4
server.tomcat.max-connections=128
server.tomcat.accept-count=32
server.connection-timeout=3s
server.tomcat.max-http-form-post-size=100000
management.endpoints.web.exposure.include=health,prometheus
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s
cache.client-token=${CACHE_CLIENT_TOKEN}
cache.internal-token=${CACHE_INTERNAL_TOKEN}
cache.admin-token=${CACHE_ADMIN_TOKEN}

# Existing scripts retain token mode; authenticated Compose enables Keycloak explicitly.
cache.auth-mode=${CACHE_AUTH_MODE:token}
cache.oidc.issuer=${CACHE_OIDC_ISSUER:http://localhost:8180/realms/cache}
cache.oidc.jwk-set-uri=${CACHE_OIDC_JWK_SET_URI:http://localhost:8180/realms/cache/protocol/openid-connect/certs}
cache.oidc.audience=${CACHE_OIDC_AUDIENCE:cache-api}
