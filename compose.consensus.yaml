# Trusted local network only. Provision etcd auth/mTLS before production use.
x-node: &node
  build: .
  mem_limit: 512m
  environment: &env
    CACHE_MODE: consensus
    CACHE_ETCD: http://etcd-0:2379,http://etcd-1:2379,http://etcd-2:2379
    CACHE_NAMESPACE: compose
    CACHE_AUTH_MODE: ${CACHE_AUTH_MODE:-keycloak}
    CACHE_OIDC_ISSUER: http://localhost:8180/realms/cache
    CACHE_OIDC_JWK_SET_URI: http://keycloak:8080/realms/cache/protocol/openid-connect/certs
    CACHE_CLIENT_TOKEN: ${CACHE_CLIENT_TOKEN:?required}
    CACHE_INTERNAL_TOKEN: ${CACHE_INTERNAL_TOKEN:?required}
    CACHE_ADMIN_TOKEN: ${CACHE_ADMIN_TOKEN:?required}
services:
  keycloak:
    extends:
      file: compose.auth.yaml
      service: keycloak
  frontend:
    extends:
      file: compose.auth.yaml
      service: frontend
    environment:
      CACHE_API_URL: http://gateway-0:8080
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?run scripts/init-auth.py}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/cache
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/cache
      KEYCLOAK_CLIENT_ID: cache-console
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?run scripts/init-auth.py}
  etcd-0:
    image: quay.io/coreos/etcd:v3.6.5
    entrypoint: /usr/local/bin/etcd
    command:
      - --name=e0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-0:2380
      - --initial-cluster=e0=http://etcd-0:2380,e1=http://etcd-1:2380,e2=http://etcd-2:2380
      - --auto-compaction-retention=1h
    volumes: [ etcd-0:/etcd-data ]
    mem_limit: 256m
  etcd-1:
    image: quay.io/coreos/etcd:v3.6.5
    entrypoint: /usr/local/bin/etcd
    command:
      - --name=e1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --initial-cluster=e0=http://etcd-0:2380,e1=http://etcd-1:2380,e2=http://etcd-2:2380
      - --auto-compaction-retention=1h
    volumes: [ etcd-1:/etcd-data ]
    mem_limit: 256m
  etcd-2:
    image: quay.io/coreos/etcd:v3.6.5
    entrypoint: /usr/local/bin/etcd
    command:
      - --name=e2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd-2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --initial-cluster=e0=http://etcd-0:2380,e1=http://etcd-1:2380,e2=http://etcd-2:2380
      - --auto-compaction-retention=1h
    volumes: [ etcd-2:/etcd-data ]
    mem_limit: 256m
  node-0:
    <<: *node
    environment:
      <<: *env
      CACHE_NODE_URL: http://node-0:8080
  node-1:
    <<: *node
    environment:
      <<: *env
      CACHE_NODE_URL: http://node-1:8080
  node-2:
    <<: *node
    environment:
      <<: *env
      CACHE_NODE_URL: http://node-2:8080
  node-3:
    <<: *node
    environment:
      <<: *env
      CACHE_NODE_URL: http://node-3:8080
  gateway-0:
    <<: *node
    ports: [ '127.0.0.1:8080:8080' ]
    environment:
      <<: *env
      CACHE_COORDINATOR: 'true'
  gateway-1:
    <<: *node
    ports: [ '127.0.0.1:8081:8080' ]
    environment:
      <<: *env
      CACHE_COORDINATOR: 'true'
volumes:
  etcd-0: { }
  etcd-1: { }
  etcd-2: { }
  keycloak-data: {}
